name: Submit tips to Monash

# The Monash probabilistic comp has no API, so this logs into its web form and posts the
# probabilities from /api/tips. It runs three mornings before each round because resubmitting
# overwrites the previous entry: Tuesday gets tips in as soon as last round's Monday game is in
# the ratings, and Wednesday/Thursday are retries. One failed run already cost a Thursday-night
# game (round 26, 2026), so two chances was one too few.
#
# Off-season, and in any week where every game has started, the feed reports `open: false` and
# the script exits 0 without logging in, so the schedule stays green until March.

on:
  schedule:
    - cron: '0 23 * * 1'   # Tue 09:00 AEST / 10:00 AEDT
    - cron: '0 23 * * 2'   # Wed 09:00 AEST / 10:00 AEDT
    - cron: '0 23 * * 3'   # Thu 09:00 AEST / 10:00 AEDT
  workflow_dispatch:
    inputs:
      round:
        description: 'Round number (blank = the round the feed is on)'
        required: false
      dry_run:
        description: 'Parse and print the mapping without submitting'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: submit-monash
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check the game matching
        run: node scripts/test-monash-matching.mjs
      - name: Submit tips
        env:
          MONASH_USER: ${{ secrets.MONASH_TIPPING_SECRET_USER }}
          MONASH_PASS: ${{ secrets.MONASH_TIPPING_SECRET_PW }}
        run: |
          node scripts/submit-monash.mjs \
            ${{ inputs.round && format('--round {0}', inputs.round) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
